<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Red Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="container">

<header>
    <h1>🟥 Pokémon Red Tracker</h1>
    <p>Complete the Kanto Pokédex</p>
</header>


<section class="dashboard">

<h2>Pokédex Progress</h2>

<div class="progress-bar">
    <div class="progress" id="dexProgress"></div>
</div>

<p id="dexPercentage">
0 / 151 Pokémon
</p>

</section>


<section class="tracker">

<div class="filter-bar">

<button class="filter-btn active" onclick="setFilter('all')">All</button>

<button class="filter-btn" onclick="setFilter('caught')">Caught</button>

<button class="filter-btn" onclick="setFilter('missing')">Missing</button>

<button class="filter-btn" onclick="setFilter('legendary')">Legendary</button>

<button class="filter-btn" onclick="setFilter('gift')">Gift</button>

<button class="filter-btn" onclick="setFilter('trade')">Trade</button>

<button class="filter-btn" onclick="setFilter('stone')">Stone</button>

<button class="filter-btn" onclick="setFilter('fossil')">Fossil</button>

</div>    

<input 
id="search"
placeholder="Search Pokémon..."
oninput="displayPokemon()"
>


<div id="pokemonList"></div>


</section>


</div>


<script src="pokemon-red.js"></script>
<script src="red.js"></script>

</body>

</html>
